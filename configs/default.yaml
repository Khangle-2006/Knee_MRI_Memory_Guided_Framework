# =====================================================================
# Default configuration for the Knee MRI Multi-Label Classification.
# Override any field via CLI flags, e.g.:
#   python scripts/train.py --epochs 100 --batch_size 32
# Use --config to load a different YAML.
# =====================================================================

# ---------- Common paths ----------
# Use the literal string "auto" to let scripts pick a view-aware default:
#   checkpoint_path "auto"  -> ./best_model_{view}_sota_1.pth
#   save_dir        "auto"  -> ./visualizations_{view}
# You can still override either field on the CLI to a custom path.
paths:
  root_dir: ./MRNet-v1.0
  backbone_weights: ./resnet18_modan_mulsupcon_1ch.pth
  checkpoint_path: auto
  save_dir: auto

# ---------- Data / View ----------
data:
  view: coronal          # sagittal | coronal | axial
  target_depth: 32
  cache_to_ram: true

# ---------- Training ----------
train:
  batch_size: 40
  num_workers: 4
  epochs: 200
  lr_backbone: 0.00005   # 5e-5
  lr_memory: 0.0005      # 5e-4
  lr_classifier: 0.0005  # 5e-4
  weight_decay: 0.001    # 1e-3
  dropout: 0.5
  label_smoothing: 0.1
  pos_weight: [1.0, 1.0, 2.0]   # [abnormal, acl, meniscus]
  pct_start: 0.3
  div_factor: 25
  final_div_factor: 1000
  use_dataparallel: true

# ---------- Multi-Scale Cropping ----------
crop:
  zoom_mid: 0.65
  zoom_close: 0.55

# ---------- ImageNet normalization ----------
norm:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

# ---------- Inference ----------
inference:
  batch_size: 16
  num_workers: 4
  zoom_mid: 0.70         # paper uses 0.70 at inference
  zoom_close: 0.55
  use_tta: true

# ---------- Visualization (Grad-CAM) ----------
visualize:
  prob_threshold: 0.5
  target_count: -1       # -1 = scan all validation cases
  slice_idx: 16

# ---------- Pretrain (RadImageNet contrastive) ----------
pretrain:
  root_dir: ./radiology_ai
  checkpoint_path: ./resnet18_modan_mulsupcon_1ch_2.pth
  batch_size: 128
  num_workers: 16
  epochs: 100
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0001   # 1e-4
  temperature: 0.07
  tau_threshold: 0.3
  embed_dim: 128